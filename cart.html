<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Lumiqart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="product-header">
    <h2>Lumiqart</h2>
    <a href="index.html">← Continue Shopping</a>
</header>

<main class="cart-page">
    <div class="cart-page-heading">
        <span>YOUR CART</span>
        <h1>Shopping Cart</h1>
        <p>Review your selected Lumiqart products before checkout.</p>
    </div>

    <div class="cart-layout">
        <section id="cart-container" class="cart-items"></section>

        <aside class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Total Items</span>
                <strong id="total-items">0</strong>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-total">
                <span>Total</span>
                <strong>₹<span id="cart-total">0</span></strong>
            </div>
            <button class="checkout-btn" type="button" onclick="checkout()">Proceed to Checkout</button>
            <button class="clear-cart-btn" type="button" onclick="clearCart()">Clear Cart</button>
        </aside>
    </div>
</main>

<script src="cart.js"></script>
</body>
</html>
